<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LHAMAT Ctrl+P · Facturación</title>
<meta name="theme-color" content="#0a0c10">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── THEMES (same as index) ── */
:root{--bg:#0a0c10;--surface:#12151c;--surface2:#1a1e28;--border:#252a38;--accent:#00e5ff;--accent2:#7c4dff;--accent3:#ff6b35;--text:#e8eaf0;--text2:#8892a4;--green:#00e676;--red:#ff5252;--yellow:#ffd740;--card-shadow:0 4px 24px rgba(0,0,0,.5);--hbg:rgba(10,12,16,.9);--mo:rgba(0,0,0,.75);--sb:#252a38}
[data-theme=light]{--bg:#f0f2f7;--surface:#fff;--surface2:#e8ecf5;--border:#d0d6e8;--accent:#0077cc;--accent2:#6633cc;--accent3:#e05a20;--text:#1a1e2e;--text2:#5a6480;--green:#00a854;--red:#d93025;--yellow:#c87d00;--card-shadow:0 4px 20px rgba(0,0,0,.08);--hbg:rgba(240,242,247,.95);--mo:rgba(0,0,0,.45);--sb:#c8cfe0}
[data-theme=night]{--bg:#040507;--surface:#090c14;--surface2:#0f1220;--border:#1a1f30;--accent:#b388ff;--accent2:#ea80fc;--accent3:#ff9e80;--text:#dce0f0;--text2:#6872a0;--green:#69f0ae;--red:#ff6e6e;--yellow:#ffe57f;--card-shadow:0 4px 32px rgba(0,0,0,.8);--hbg:rgba(4,5,7,.96);--mo:rgba(0,0,0,.88);--sb:#1a1f30}
[data-theme=beige]{--bg:#f5efe6;--surface:#faf6f0;--surface2:#ede5d8;--border:#d8cbbf;--accent:#8b5e3c;--accent2:#b07c3e;--accent3:#c0562a;--text:#2c1f12;--text2:#7a6555;--green:#4a7c59;--red:#a8392d;--yellow:#a07000;--card-shadow:0 4px 20px rgba(80,50,20,.12);--hbg:rgba(245,239,230,.95);--mo:rgba(30,15,5,.55);--sb:#c8b9a8}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background-image:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAS0AAAD6CAYAAAD0rxHNAAAASklEQVR4nO3BMQEAAADCoPVP7WsIoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAeAMBxAABOgAAAABJRU5ErkJggg==');background-repeat:repeat;background-size:200px auto;opacity:0.35;pointer-events:none;z-index:0}

/* HEADER */
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--hbg);backdrop-filter:blur(12px);gap:8px;flex-wrap:wrap;flex-shrink:0}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 16px rgba(0,229,255,.3)}
.logo-text{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-2px;color:var(--text)}
.logo-text span{color:var(--accent)}
.logo-sub{font-size:9px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-top:-2px}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stat-pill{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--surface);border:1px solid var(--border);border-radius:999px;font-size:10px;color:var(--text2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.theme-sw{display:flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}
.tbtn{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:none;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tbtn:hover{transform:scale(1.15)}
.tbtn.on{border-color:var(--accent);background:rgba(128,128,128,.12)}
.hbtn{display:flex;align-items:center;gap:5px;padding:7px 13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap;text-decoration:none}
.hbtn:hover{transform:translateY(-1px)}
.hbtn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.hbtn.danger{background:rgba(255,82,82,.12);border:1px solid rgba(255,82,82,.3);color:var(--red)}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;flex-shrink:0;overflow-x:auto;position:relative;z-index:5}
.tab{padding:10px 14px;font-size:11px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* LAYOUT */
.app{flex:1;overflow:hidden;position:relative;z-index:1;display:flex;flex-direction:column}
.section{display:none;flex:1;overflow-y:auto;padding:16px}
.section.active{display:block}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
.card-title{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* STATS */
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat-label{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:500;font-family:'DM Mono',monospace}
.stat-unit{font-size:11px;color:var(--text2);margin-left:4px}
.stat-card.ac .stat-value{color:var(--accent)}
.stat-card.wa .stat-value{color:var(--yellow)}
.stat-card.gr .stat-value{color:var(--green)}
.stat-card.re .stat-value{color:var(--red)}

/* FORMS */
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);font-family:'Syne',sans-serif;font-weight:600}
.form-input,.form-select,.form-textarea{padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none;transition:border-color .15s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,255,.08)}
.form-textarea{resize:vertical;min-height:65px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row.g3{grid-template-columns:1fr 1fr 1fr}
.form-row.g4{grid-template-columns:repeat(4,1fr)}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--text2)}
.btn-danger{background:rgba(255,82,82,.12);color:var(--red);border:1px solid rgba(255,82,82,.3)}
.btn-danger:hover{background:rgba(255,82,82,.2)}
.btn-warn{background:rgba(255,215,64,.1);color:var(--yellow);border:1px solid rgba(255,215,64,.25)}
.btn-sm{padding:4px 10px;font-size:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:8px 10px;text-align:left;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);font-family:'Syne',sans-serif;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid rgba(37,42,56,.5);vertical-align:middle}
tbody tr:hover td{background:rgba(0,229,255,.03)}
tbody tr:last-child td{border-bottom:none}
.td-num{text-align:right;font-family:'DM Mono',monospace}
.td-mono{font-family:'DM Mono',monospace;font-size:11px}
.td-code{color:var(--accent);font-size:9px;letter-spacing:1px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:9px;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:.5px}
.badge-ok{background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.25)}
.badge-pending{background:rgba(255,215,64,.12);color:var(--yellow);border:1px solid rgba(255,215,64,.25)}
.badge-purple{background:rgba(124,77,255,.12);color:var(--accent2);border:1px solid rgba(124,77,255,.25)}

/* NEXT-CLOSE BANNER */
.close-banner{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.close-banner.urgent{border-color:rgba(255,82,82,.4);background:rgba(255,82,82,.05)}
.close-banner.soon{border-color:rgba(255,215,64,.35);background:rgba(255,215,64,.04)}
.cb-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin-bottom:3px}
.cb-company{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
.cb-date{font-size:10px;color:var(--text2);margin-top:2px}
.cb-days{font-size:36px;font-weight:300;font-family:'DM Mono',monospace}
.cb-days.urgent{color:var(--red)}
.cb-days.soon{color:var(--yellow)}
.cb-days.ok{color:var(--green)}

/* CIERRE BLOCK ENGINE */
.cblock{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
.cblock-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--border)}
.cblock-dept-input{background:transparent;border:none;outline:none;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);width:60%}
.cblock-total{font-size:12px;font-family:'DM Mono',monospace;color:var(--accent)}
.cblock-body{padding:10px 12px}
.seg-labels{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 0.9fr 28px;gap:6px;margin-bottom:4px}
.seg-label{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.seg-row{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 0.9fr 28px;gap:6px;align-items:center;margin-bottom:6px}
.seg-diff{font-size:13px;font-weight:600;font-family:'DM Mono',monospace;text-align:right;color:var(--accent)}
.add-seg-btn{font-size:10px;color:var(--accent);background:none;border:1px dashed rgba(0,229,255,.3);padding:4px 9px;border-radius:6px;cursor:pointer;font-family:'DM Mono',monospace}
.add-seg-btn:hover{background:rgba(0,229,255,.06)}
.extra-row{display:grid;grid-template-columns:2fr 1fr 28px;gap:6px;align-items:center;margin-bottom:6px}
.total-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:8px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:var(--mo);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:700px;max-height:95vh;overflow-y:auto;animation:su .25s ease}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.modal-close{width:30px;height:30px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.modal-close:hover{border-color:var(--red);color:var(--red)}
.modal-body{padding:20px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}

/* INVOICE PREVIEW */
.inv-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;font-size:12px;line-height:1.7}
.inv-head{display:flex;justify-content:space-between;margin-bottom:20px;border-bottom:2px solid var(--text);padding-bottom:12px}
.inv-title-txt{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.inv-num{font-size:11px;color:var(--accent);font-family:'DM Mono',monospace}
.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ipl{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin-bottom:5px;border-bottom:1px solid var(--border);padding-bottom:3px}
.ipn{font-weight:700;font-size:13px;font-family:'Syne',sans-serif;margin-bottom:2px}
.ipd{color:var(--text2);font-size:10px}
.inv-table{width:100%;border-collapse:collapse;margin:12px 0}
.inv-table th{background:var(--surface2);color:var(--text2);padding:6px 8px;font-size:9px;text-align:left;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border)}
.inv-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:11px}
.inv-table .tr-sub td{font-weight:700;background:var(--surface2);font-family:'DM Mono',monospace}
.inv-table .tr-tot td{font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-family:'DM Mono',monospace}
.inv-sigs{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
.sig-line{border-bottom:1px solid var(--text);margin-bottom:5px;height:28px}
.bank-note{background:var(--surface2);border-left:3px solid var(--border);padding:8px 12px;font-size:10px;color:var(--text2);margin-top:12px;border-radius:0 6px 6px 0}

/* EMPTY */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text2);text-align:center;gap:8px}
.empty-icon{font-size:40px;opacity:.3}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:10px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--text);box-shadow:var(--card-shadow);z-index:9999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--red);color:var(--red)}

/* PRINT */
@media print{
  header,.tabs,.btn,.btn-row,.no-print{display:none!important}
  body{background:#fff!important;overflow:visible!important}
  .section{display:block!important;overflow:visible!important}
  .inv-wrap{border:none;padding:0}
  .inv-table .tr-tot td{background:#333!important;color:#fff!important;-webkit-print-color-adjust:exact}
}

/* Light/beige fixes */
[data-theme=light] .btn-primary,[data-theme=beige] .btn-primary{color:#fff}
[data-theme=light] .inv-table .tr-tot td,[data-theme=beige] .inv-table .tr-tot td{color:#fff}

@media(max-width:600px){
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .form-row,.form-row.g3,.form-row.g4{grid-template-columns:1fr}
  .inv-parties,.inv-sigs{grid-template-columns:1fr}
  .seg-labels,.seg-row{grid-template-columns:2fr 1fr 1fr 0.8fr 24px}
}
</style>
</head>
<body>
<div id="toast"></div>

<header>
  <a class="logo" href="index.html" title="Volver a Ctrl+P">
    <div class="logo-icon">🖨️</div>
    <div>
      <div class="logo-text">Ctrl<span>+P</span></div>
      <div class="logo-sub">Facturación</div>
    </div>
  </a>
  <div class="header-right">

    <div class="theme-sw">
      <button class="tbtn on" id="th-cyber"  onclick="setTheme('cyber')"  title="Cyber">🌌</button>
      <button class="tbtn"    id="th-night"  onclick="setTheme('night')"  title="Noche">🌙</button>
      <button class="tbtn"    id="th-light"  onclick="setTheme('light')"  title="Claro">☀️</button>
      <button class="tbtn"    id="th-beige"  onclick="setTheme('beige')"  title="Beige">📜</button>
    </div>
    <a class="hbtn ghost" href="index.html">← Impresoras</a>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('dashboard',this)">📊 Dashboard</div>
  <div class="tab" onclick="showTab('empresas',this)">🏢 Empresas</div>
  <div class="tab" onclick="showTab('cierres',this)">📅 Cierres</div>
  <div class="tab" onclick="showTab('factura',this)">📄 Factura</div>
  <div class="tab" onclick="showTab('impuestos',this)">💰 Impuestos</div>
</div>

<div class="app">
  <div id="tab-dashboard" class="section active"></div>
  <div id="tab-empresas"  class="section"></div>
  <div id="tab-cierres"   class="section"></div>
  <div id="tab-factura"   class="section"></div>
  <div id="tab-impuestos" class="section"></div>
</div>

<!-- ── MODAL: EMPRESA ── -->
<div class="modal-overlay" id="modal-emp">
<div class="modal">
  <div class="modal-header">
    <div class="modal-title" id="emp-modal-title">Nueva Empresa</div>
    <button class="modal-close" onclick="closeOverlay('modal-emp')">✕</button>
  </div>
  <div class="modal-body">
    <div class="form-group"><label class="form-label">Nombre completo</label><input class="form-input" id="e-nombre" placeholder="Unidad No. 2 de Aseguramiento..."></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">NIT</label><input class="form-input" id="e-nit" placeholder="12001113886"></div>
      <div class="form-group"><label class="form-label">REEUP</label><input class="form-input" id="e-reeup" placeholder="321-1-09340"></div>
    </div>
    <div class="form-group"><label class="form-label">Dirección</label><input class="form-input" id="e-dir" placeholder="Calle 27 No. 28..."></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="e-tel" placeholder="52878123"></div>
      <div class="form-group"><label class="form-label">Precio / hoja (CUP)</label><input class="form-input" type="number" id="e-precio" value="8" step="0.01"></div>
    </div>
    <div class="form-row g3">
      <div class="form-group"><label class="form-label">Responsable económico</label><input class="form-input" id="e-resp" placeholder="Nombre completo"></div>
      <div class="form-group"><label class="form-label">CI responsable</label><input class="form-input" id="e-ci" placeholder="67031114299"></div>
      <div class="form-group"><label class="form-label">Cargo</label><input class="form-input" id="e-cargo" placeholder="J´ Dpto. Económico"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Día habitual de cierre</label><input class="form-input" type="number" id="e-dia" value="28" min="1" max="31"></div>
    </div>
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin:10px 0 0;padding-bottom:5px">Departamentos e impresoras</div>
    <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px">
      <div style="display:grid;grid-template-columns:160px 1fr 28px;background:var(--surface2);border-bottom:1px solid var(--border)">
        <div style="padding:5px 10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);border-right:1px solid var(--border)">Departamento</div>
        <div style="padding:5px 10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2)">Impresoras asignadas</div>
        <div></div>
      </div>
      <div id="e-deptos-blocks"></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="addEmpDepto()" style="margin-bottom:8px">+ Departamento</button>
  </div>

let _empDeptId=0;

/* Impresoras disponibles para asignar a un dpto de esta empresa:
   - Ya asignadas a ese dpto (se incluyen siempre)
   - Libres: no activas O activas sin dpto O activas de esta empresa
     que no estén ya usadas en otro bloque del modal */
function _empAvailPrinters(empId, currentPrinterIds){
  if(!db.printers||!db.printers.length) return [];
  // IDs ya asignados en todos los bloques del modal
  const usedInModal=new Set();
  document.querySelectorAll('#e-deptos-blocks .edp-printer-sel').forEach(sel=>{
    if(sel.value) usedInModal.add(sel.value);
  });
  return db.printers.filter(p=>{
    if(currentPrinterIds&&currentPrinterIds.includes(p.id)) return true; // propia del bloque
    if(usedInModal.has(p.id)) return false; // ya en otro bloque
    // Libre: no activa, o activa de esta empresa sin dpto asignado
    if(p.status!=='Activa') return true;
    if(p.company===empId&&(!p.dept||p.dept==='')) return true;
    return false;
  });
}

function _empPrinterOpts(empId, selectedId){
  const si=s=>s==='Activa'?'🟢':s==='Mantenimiento'?'🟡':'🔴';
  const all=db.printers||[];
  const usedInModal=new Set();
  document.querySelectorAll('#e-deptos-blocks .edp-printer-sel').forEach(sel=>{
    if(sel.value&&sel.value!==selectedId) usedInModal.add(sel.value);
  });
  const opts=all.filter(p=>p.id===selectedId||!usedInModal.has(p.id));
  const activas=opts.filter(p=>p.status==='Activa'&&p.company===empId);
  const libres=opts.filter(p=>p.id!==selectedId&&(p.status!=='Activa'||p.company!==empId));
  let html='<option value="">— impresora —</option>';
  if(activas.length){
    html+=`<optgroup label="Activas (esta empresa)">`;
    activas.forEach(p=>{html+=`<option value="${p.id}"${p.id===selectedId?' selected':''}>${si(p.status)} ${p.name}${p.dept?' ('+p.dept+')':''}</option>`;});
    html+=`</optgroup>`;
  }
  if(libres.length){
    html+=`<optgroup label="Libres / intercambio">`;
    libres.forEach(p=>{html+=`<option value="${p.id}"${p.id===selectedId?' selected':''}>${si(p.status)} ${p.name} · ${p.status}</option>`;});
    html+=`</optgroup>`;
  }
  return html;
}

function saveEmpresa(){
  const n=document.getElementById('e-nombre').value.trim();
  if(!n){toast('Nombre requerido',true);return;}
  const empId=_editEmpId||uid();
  // Collect deptos from blocks
  const deptBlocks=document.querySelectorAll('#e-deptos-blocks [id^="edp"]');
  const deps=[];
  let valid=true;
  deptBlocks.forEach(block=>{
    const dname=block.querySelector('.edp-name').value.trim();
    if(!dname)return;
    const printers=[];
    block.querySelectorAll('.edp-printer-sel').forEach(sel=>{if(sel.value)printers.push(sel.value);});
    block.querySelectorAll('.edp-printer-txt').forEach(inp=>{if(inp.value.trim())printers.push(inp.value.trim());});
    if(!printers.length){toast('El dpto "'+dname+'" no tiene impresora asignada',true);valid=false;return;}
    deps.push({name:dname,printers});
    // Update printer dept assignment in db.printers cache
    printers.forEach(pid=>{
      const p=db.printers&&db.printers.find(x=>x.id===pid);
      if(p){p.dept=dname;p.company=empId;p.status='Activa';}
    });
  });
  if(!valid)return;
  if(!deps.length){toast('Agregue al menos un departamento con impresora',true);return;}
  const obj={id:empId,nombre:n,
    nit:document.getElementById('e-nit').value.trim(),
    reeup:document.getElementById('e-reeup').value.trim(),
    direccion:document.getElementById('e-dir').value.trim(),
    tel:document.getElementById('e-tel').value.trim(),
    responsable:document.getElementById('e-resp').value.trim(),
    ci:document.getElementById('e-ci').value.trim(),
    cargo:document.getElementById('e-cargo').value.trim(),
    precio:parseFloat(document.getElementById('e-precio').value)||8,
    diaCierre:parseInt(document.getElementById('e-dia').value)||28,
    deptos:deps.map(d=>d.name)
  };
  if(_editEmpId){const i=db.empresas.findIndex(e=>e.id===_editEmpId);if(i>=0)db.empresas[i]=obj;}
  else db.empresas.push(obj);
  saveDB();closeOverlay('modal-emp');renderEmpresas();updateHeader();
  // Push printer updates to GitHub
  pushPrinterUpdates();
  toast('Empresa guardada ✓');
}

/* Push updated printer assignments back to data.json in GitHub */
async function pushPrinterUpdates(){
  try{
    const GH_USER='lhamat123',GH_REPO='CtrlP',GH_FILE='data.json';
    const token=localStorage.getItem('gh_token');
    if(!token)return; // no token, skip silent
    const apiUrl=`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`;
    const cur=await fetch(apiUrl,{headers:{Authorization:'token '+token}});
    if(!cur.ok)return;
    const meta=await cur.json();
    const raw=atob(meta.content.replace(/\n/g,''));
    const data=JSON.parse(raw);
    // Merge printer changes
    db.printers.forEach(p=>{
      const idx=data.printers.findIndex(x=>x.id===p.id);
      if(idx>=0){data.printers[idx].dept=p.dept;data.printers[idx].status=p.status;}
    });
    const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    await fetch(apiUrl,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},
      body:JSON.stringify({message:'Facturación: actualiza dptos/impresoras',content:encoded,sha:meta.sha})});
  }catch(e){}
}

function delEmp(id){
  if(!confirm('¿Eliminar empresa y todos sus cierres?'))return;
  db.empresas=db.empresas.filter(e=>e.id!==id);
  db.cierres=db.cierres.filter(c=>c.empresaId!==id);
  saveDB();renderEmpresas();updateHeader();toast('Empresa eliminada');
}

let _blockId=0;

function makeBlock(container,dept,segments,empId){
  const bid='cb'+(++_blockId);
  const _empId=empId||'';
  const _dept=dept||'';
  const segs=segments||[{printer:'',apertura:'',cierre:'',nota:''}];
  const div=document.createElement('div');
  div.id=bid;div.className='cblock';
  div.dataset.empId=_empId;div.dataset.dept=_dept;
  div.innerHTML=`
    <div class="cblock-head">
      <input class="cblock-dept-input" value="${_dept}" placeholder="Departamento / Centro de costo" oninput="recalcBlock('${bid}')">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="cblock-total" id="${bid}-total">0 hojas</span>
        <button class="btn btn-danger btn-sm" onclick="document.getElementById('${bid}').remove();recalcAll()" style="padding:3px 7px">✕</button>
      </div>
    </div>
    <div class="cblock-body">
      <div class="seg-labels">
        <div class="seg-label">Impresora</div>
        <div class="seg-label" style="text-align:right">Apertura</div>
        <div class="seg-label" style="text-align:right">Cierre</div>
        <div class="seg-label" style="text-align:right">Hojas</div>
        <div></div>
      </div>
      <div id="${bid}-segs"></div>
      <button class="add-seg-btn" onclick="addSegment('${bid}','','${_empId}','${_dept}')">+ impresora / sustitución</button>
    </div>`;
  container.appendChild(div);
  segs.forEach(s=>addSegment(bid,s,_empId,_dept));
  return bid;
}

/* Busca el último valor de cierre de una impresora en los cierres guardados */
function _lastCierreVal(printerId){
  if(!printerId||!db.cierres||!db.cierres.length) return '';
  // Buscar en todos los cierres, el más reciente que tenga esta impresora
  const sorted=[...db.cierres].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  for(const c of sorted){
    for(const d of (c.depts||[])){
      for(const s of (d.segments||[])){
        if(s.printerId===printerId&&s.cierre) return s.cierre;
      }
    }
  }
  // También buscar en printers cache (lastReading del JSON)
  const p=db.printers&&db.printers.find(x=>x.id===printerId);
  if(p&&p.lastReading) return p.lastReading;
  return '';
}

function _cierrePrinterOpts(empId, dept, selectedId){
  if(!db.printers||!db.printers.length) return null; // null = usar texto libre
  const si=s=>s==='Activa'?'🟢':s==='Mantenimiento'?'🟡':'🔴';
  // Impresoras del dpto de esta empresa + libres
  const usedInBlock=new Set();
  // no bloquear por bloque aquí, el mismo dpto puede tener varias
  const deptPs=(db.printers||[]).filter(p=>p.company===empId&&p.dept===dept&&p.status==='Activa');
  const libres=(db.printers||[]).filter(p=>p.company===empId&&p.status!=='Activa');
  let html=`<option value="">— seleccionar —</option>`;
  if(deptPs.length){
    html+=`<optgroup label="Asignadas al dpto">`;
    deptPs.forEach(p=>{html+=`<option value="${p.id}"${p.id===selectedId?' selected':''}>${si(p.status)} ${p.name}</option>`;});
    html+=`</optgroup>`;
  }
  if(libres.length){
    html+=`<optgroup label="Libres (intercambio)">`;
    libres.forEach(p=>{html+=`<option value="${p.id}"${p.id===selectedId?' selected':''}>${si(p.status)} ${p.name} · ${p.status}</option>`;});
    html+=`</optgroup>`;
  }
  return html;
}

function addSegment(bid,seg,empId,dept){
  const sid='cs'+(++_blockId);
  const s=seg||{};
  const row=document.createElement('div');
  row.id=sid;row.className='seg-row';
  const optsHtml=empId?_cierrePrinterOpts(empId,dept||'',s.printerId||''):null;
  const printerInput=optsHtml!==null
    ?`<select class="form-select seg-printer-sel" data-bid="${bid}" data-sid="${sid}"
        style="font-size:11px;margin-bottom:3px;width:100%"
        onchange="onCierrePrinterSel(this,'${bid}','${sid}')">${optsHtml}</select>`
    :`<input class="form-input seg-printer" value="${s.printer||''}" placeholder="Epson ET 4150 / modelo" style="font-size:11px;margin-bottom:3px;width:100%" oninput="recalcBlock('${bid}')">`;
  // Apertura: último cierre guardado para esta impresora
  const apertura=s.apertura!==undefined?s.apertura:_lastCierreVal(s.printerId||'');
  row.innerHTML=`
    <div>
      ${printerInput}
      <input class="form-input seg-nota" value="${s.nota||''}" placeholder="nota: sustitución, temporal…" style="font-size:10px;background:var(--surface);opacity:.7;width:100%">
    </div>
    <input class="form-input seg-ap" type="number" value="${apertura}" placeholder="00000" style="text-align:right;font-size:12px" oninput="recalcBlock('${bid}')">
    <input class="form-input seg-cl" type="number" value="${s.cierre||''}" placeholder="00000" style="text-align:right;font-size:12px" oninput="recalcBlock('${bid}')">
    <div class="seg-diff" id="${sid}-diff" style="color:var(--text2)">—</div>
    <button class="btn btn-danger btn-sm" style="padding:3px 7px;align-self:start" onclick="document.getElementById('${sid}').remove();recalcBlock('${bid}')">✕</button>`;
  document.getElementById(bid+'-segs').appendChild(row);
  recalcBlock(bid);
}

function onCierrePrinterSel(sel,bid,sid){
  const printerId=sel.value;
  const row=document.getElementById(sid);if(!row)return;
  const apInput=row.querySelector('.seg-ap');
  if(apInput){
    const last=_lastCierreVal(printerId);
    if(last!=='')apInput.value=last;
  }
  recalcBlock(bid);
}

function recalcBlock(bid){
  const block=document.getElementById(bid);if(!block)return;
  let total=0;
  block.querySelectorAll('.seg-row').forEach(row=>{
    const ap=parseFloat(row.querySelector('.seg-ap').value)||0;
    const cl=parseFloat(row.querySelector('.seg-cl').value)||0;
    const diff=cl>0&&ap>0?Math.max(0,cl-ap):0;
    const dEl=row.querySelector('[id$="-diff"]');
    if(dEl){dEl.textContent=diff>0?fmtI(diff):'—';dEl.style.color=diff>0?'var(--accent)':'var(--text2)';}
    total+=diff;
  });
  const tot=document.getElementById(bid+'-total');
  if(tot)tot.textContent=fmtI(total)+' hojas';
  recalcAll();
}

function makeExtraRow(container,label){
  const eid='ce'+(++_blockId);
  const div=document.createElement('div');
  div.id=eid;div.className='extra-row';
  div.innerHTML=`
    <input class="form-input extra-label" value="${label}" style="font-size:12px;font-weight:600;background:rgba(255,215,64,.07);border-color:rgba(255,215,64,.2)" oninput="recalcAll()">
    <input class="form-input extra-qty" type="number" value="0" style="text-align:right;font-size:12px;background:rgba(255,215,64,.07);border-color:rgba(255,215,64,.2)" oninput="recalcAll()">
    <button class="btn btn-danger btn-sm" style="padding:3px 7px" onclick="document.getElementById('${eid}').remove();recalcAll()">✕</button>`;
  container.appendChild(div);recalcAll();
}

function recalcAll(){
  const container=document.getElementById('c-blocks');if(!container)return;
  let total=0;
  container.querySelectorAll('.cblock').forEach(b=>{
    b.querySelectorAll('.seg-row').forEach(row=>{
      const ap=parseFloat(row.querySelector('.seg-ap').value)||0;
      const cl=parseFloat(row.querySelector('.seg-cl').value)||0;
      total+=cl>0&&ap>0?Math.max(0,cl-ap):0;
    });
  });
  container.querySelectorAll('.extra-row').forEach(r=>{
    total+=parseFloat(r.querySelector('.extra-qty').value)||0;
  });
  const empId=document.getElementById('c-emp')&&document.getElementById('c-emp').value;
  const emp=getEmp(empId);
  const precio=emp?emp.precio:8;
  const imp=total*precio;
  const imp10=imp*0.1;
  const imp05=Math.max(0,(imp-3260)*0.05);
  const box=document.getElementById('c-total-box');
  if(box)box.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <span style="font-size:12px;color:var(--text2)">Total hojas: <strong style="font-family:'DM Mono',monospace;color:var(--text)">${fmtI(total)}</strong></span>
      <span style="font-size:12px;color:var(--text2)">Precio: <strong style="font-family:'DM Mono',monospace">${precio} CUP/hoja</strong></span>
      <span style="font-size:15px;font-weight:700;font-family:'DM Mono',monospace;color:var(--accent)">${fmt(imp)} CUP</span>
    </div>
    <div style="margin-top:6px;font-size:10px;color:var(--text2);font-family:'DM Mono',monospace">
      Imp. 10% → <span style="color:var(--yellow)">${fmt(imp10)} CUP</span> &nbsp;|&nbsp; Imp. 5% → <span style="color:var(--red)">${fmt(imp05)} CUP</span>
    </div>`;
}

function collectCierreData(){
  const container=document.getElementById('c-blocks');
  const depts=[];
  container.querySelectorAll('.cblock').forEach(b=>{
    const dept=b.querySelector('.cblock-dept-input').value.trim();
    const segments=[];
    b.querySelectorAll('.seg-row').forEach(row=>{
      const ap=parseFloat(row.querySelector('.seg-ap').value)||0;
      const cl=parseFloat(row.querySelector('.seg-cl').value)||0;
      const sel=row.querySelector('.seg-printer-sel');
      const txt=row.querySelector('.seg-printer');
      const printerId=sel?sel.value:'';
      const printerName=sel?(sel.options[sel.selectedIndex]&&sel.options[sel.selectedIndex].textContent)||'':(txt?txt.value.trim():'');
      segments.push({
        printerId,printer:printerName,
        nota:row.querySelector('.seg-nota').value.trim(),
        apertura:ap,cierre:cl,hojas:cl>0&&ap>0?Math.max(0,cl-ap):0
      });
      // Update lastReading in printers cache
      if(printerId&&cl>0){
        const p=db.printers&&db.printers.find(x=>x.id===printerId);
        if(p)p.lastReading=cl;
      }
    });
    depts.push({dept,segments,subtotal:segments.reduce((a,s)=>a+s.hojas,0)});
  });
  const extras=[];
  container.querySelectorAll('.extra-row').forEach(r=>{
    extras.push({label:r.querySelector('.extra-label').value.trim(),qty:parseFloat(r.querySelector('.extra-qty').value)||0});
  });
  return{depts,extras};
}

function saveCierre(){
  const empId=document.getElementById('c-emp').value;
  const emp=getEmp(empId);
  if(!empId||!emp){toast('Seleccione una empresa',true);return;}
  const mes=document.getElementById('c-mes').value;
  const fecha=document.getElementById('c-fecha').value;
  const factura=document.getElementById('c-facnum').value.trim();
  const{depts,extras}=collectCierreData();
  const totalHojasDepts=depts.reduce((a,d)=>a+d.subtotal,0);
  const totalExtra=extras.reduce((a,e)=>a+e.qty,0);
  const totalHojas=totalHojasDepts+totalExtra;
  const totalImporte=totalHojas*emp.precio;
  const imp10=totalImporte*0.1;
  const imp05=Math.max(0,(totalImporte-3260)*0.05);
  db.cierres.push({
    id:uid(),empresaId:empId,mes,fecha,
    depts,extras,totalHojas,totalImporte,
    impuesto10:imp10,impuesto05:imp05,
    factura,facturado:!!factura
  });
  saveDB();pushPrinterUpdates();closeOverlay('modal-cierre');renderCierres();updateHeader();
  toast('Cierre registrado ✓');
}

/* Devuelve los IDs de impresoras ya seleccionadas en cualquier bloque activo */
function _facUsedPrinters(){
  const used=new Set();
  document.querySelectorAll('#f-blocks .fp-select').forEach(sel=>{
    if(sel.value)used.add(sel.value);
  });
  return used;
}

/* Construye las <option> para un selector de impresora de la empresa dada.
   currentId = la impresora actualmente seleccionada en ESTE selector (siempre se incluye).
   Solo se ofrecen:
     a) La impresora ya asignada al departamento (status=Activa, misma empresa).
     b) Impresoras LIBRES: de la misma empresa, cuyo estado NO es 'Activa'
        (Inactiva o Mantenimiento) y que no están usadas en otro bloque.
*/
function _facPrinterOptions(companyId, currentId){
  if(!db.printers||!db.printers.length) return '<option value="">— sin datos —</option>';
  const used=_facUsedPrinters();
  const all=db.printers.filter(p=>p.company===companyId);
  const opts=all.filter(p=>{
    if(p.id===currentId) return true;       // siempre incluir la actual
    if(used.has(p.id)) return false;         // ya usada en otro bloque
    if(p.status==='Activa') return false;    // activa en otro dpto → no disponible
    return true;                             // libre (Inactiva / Mantenimiento)
  });
  const statusIcon=s=>s==='Activa'?'🟢':s==='Mantenimiento'?'🟡':'🔴';
  let html='<option value="">— seleccionar —</option>';
  // Grupo: asignada al bloque (activas de la empresa no usadas en otro bloque)
  const asignadas=all.filter(p=>p.status==='Activa'&&(p.id===currentId||!used.has(p.id)));
  if(asignadas.length){
    html+=`<optgroup label="Activas">`;
    asignadas.forEach(p=>{html+=`<option value="${p.id}"${p.id===currentId?' selected':''}>${statusIcon(p.status)} ${p.name} (${p.dept||'—'})</option>`;});
    html+=`</optgroup>`;
  }
  // Grupo: libres (no activas)
  const libres=all.filter(p=>p.status!=='Activa'&&(p.id===currentId||!used.has(p.id)));
  if(libres.length){
    html+=`<optgroup label="Libres (disponibles para intercambio)">`;
    libres.forEach(p=>{html+=`<option value="${p.id}"${p.id===currentId?' selected':''}>${statusIcon(p.status)} ${p.name} · ${p.status}</option>`;});
    html+=`</optgroup>`;
  }
  return html;
}

  const emp=getEmp(document.getElementById('f-emp').value);

    const compPrinters=db.printers.filter(p=>p.company===empId&&p.status==='Activa');
    const byDept={};
    compPrinters.forEach(p=>{
      const d=p.dept||'—';
      if(!byDept[d])byDept[d]=[];
      byDept[d].push(p);
    });
    if(Object.keys(byDept).length){
      Object.entries(byDept).forEach(([dept,ps])=>addFacDepto(dept,ps));
    } else {
      // empresa sin impresoras en cache: crear bloques vacíos por los deptos guardados
      emp.deptos.forEach(d=>addFacDepto(d,[]));
    }
  } else if(emp){
    emp.deptos.forEach(d=>addFacDepto(d,[]));
  } else {
    addFacDepto();
  }
  buildFac();
}

/* Recoge líneas para vista previa / guardado.
   Una línea por bloque-departamento (suma hojas de sus impresoras).
   Los nombres de impresora se incluyen como detalle. */
function getFacLines(){
  const lines=[];
  document.querySelectorAll('#f-blocks .cblock').forEach(block=>{
    const dept=block.querySelector('.cblock-dept-input').value.trim();
    let total=0;
    const impresoras=[];
    block.querySelectorAll('[id^="fr"]').forEach(row=>{
      const qty=parseFloat(row.querySelector('.fp-qty').value)||0;
      const sel=row.querySelector('.fp-select');
      const nameEl=row.querySelector('.fp-name');
      let nombre='';
      if(sel&&sel.value){
        const p=db.printers&&db.printers.find(x=>x.id===sel.value);
        nombre=p?p.name:(sel.options[sel.selectedIndex]&&sel.options[sel.selectedIndex].text)||'';
      } else if(nameEl){
        nombre=nameEl.value.trim();
      }
      if(nombre||qty>0){impresoras.push({nombre,qty});total+=qty;}
    });
    if(dept||total>0)lines.push({dept:dept||'—',qty:total,impresoras});
  });
  document.querySelectorAll('#f-blocks .extra-row').forEach(row=>{
    const dept=row.querySelector('.fb-dept').value.trim();
    const qty=parseFloat(row.querySelector('.fb-qty').value)||0;
    if(dept||qty>0)lines.push({dept,qty,impresoras:[]});
  });
  return lines;
}

// ═══ IMPUESTOS ═══
function renderImpuestos(){
  const el=document.getElementById('tab-impuestos');
  const years=[...new Set(db.cierres.map(c=>c.mes?c.mes.split('-')[0]:null).filter(Boolean))].sort().reverse();
  const curYear=new Date().getFullYear().toString();
  const selYear=years.includes(curYear)?curYear:(years[0]||curYear);
  const yearCierres=db.cierres.filter(c=>c.mes&&c.mes.startsWith(selYear));
  const byMonth={};
  yearCierres.forEach(c=>{
    const m=c.mes;
    if(!byMonth[m])byMonth[m]={mes:m,hojas:0,importe:0,imp10:0,imp05:0};
    byMonth[m].hojas+=c.totalHojas||0;
    byMonth[m].importe+=c.totalImporte||0;
    byMonth[m].imp10+=c.impuesto10||0;
    byMonth[m].imp05+=c.impuesto05||0;
  });
  const meses=Object.values(byMonth).sort((a,b)=>a.mes.localeCompare(b.mes));
  const totImp=yearCierres.reduce((a,c)=>a+(c.totalImporte||0),0);
  const tot10=yearCierres.reduce((a,c)=>a+(c.impuesto10||0),0);
  const tot05=yearCierres.reduce((a,c)=>a+(c.impuesto05||0),0);
  el.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px">Resumen de Impuestos</div>
  <div class="grid3" style="margin-bottom:14px">
    <div class="stat-card gr"><div class="stat-label">Ingresos ${selYear}</div><div class="stat-value">${fmt(totImp)}<span class="stat-unit">CUP</span></div></div>
    <div class="stat-card wa"><div class="stat-label">Imp. ventas 10%</div><div class="stat-value">${fmt(tot10)}<span class="stat-unit">CUP</span></div></div>
    <div class="stat-card re"><div class="stat-label">Contribución 5%</div><div class="stat-value">${fmt(tot05)}<span class="stat-unit">CUP</span></div></div>
  </div>
  <div class="card"><div class="card-title">Desglose mensual — ${selYear}</div>
    ${meses.length===0?'<div class="empty-state"><div class="empty-icon">💰</div><div>Sin datos para este año</div></div>':
    `<div class="tbl-wrap"><table>
      <thead><tr><th>Mes</th><th class="td-num">Hojas</th><th class="td-num">Importe</th><th class="td-num">Imp.10%</th><th class="td-num">Imp.5%</th><th class="td-num">Total Imp.</th></tr></thead>
      <tbody>
        ${meses.map(m=>`<tr>
          <td style="font-weight:600">${mesLabel(m.mes)}</td>
          <td class="td-num td-mono">${fmtI(m.hojas)}</td>
          <td class="td-num td-mono" style="color:var(--accent)">${fmt(m.importe)}</td>
          <td class="td-num td-mono" style="color:var(--yellow)">${fmt(m.imp10)}</td>
          <td class="td-num td-mono" style="color:var(--red)">${fmt(m.imp05)}</td>
          <td class="td-num td-mono" style="font-weight:700">${fmt(m.imp10+m.imp05)}</td>
        </tr>`).join('')}
        <tr style="border-top:2px solid var(--border)">
          <td style="font-weight:700;font-family:'Syne',sans-serif">TOTAL ${selYear}</td>
          <td class="td-num td-mono" style="font-weight:700">${fmtI(yearCierres.reduce((a,c)=>a+(c.totalHojas||0),0))}</td>
          <td class="td-num td-mono" style="color:var(--accent);font-weight:700">${fmt(totImp)}</td>
          <td class="td-num td-mono" style="color:var(--yellow);font-weight:700">${fmt(tot10)}</td>
          <td class="td-num td-mono" style="color:var(--red);font-weight:700">${fmt(tot05)}</td>
          <td class="td-num td-mono" style="font-weight:700;font-size:13px">${fmt(tot10+tot05)}</td>
        </tr>
      </tbody>
    </table></div>`}
  </div>
  <div class="card"><div class="card-title">Por empresa — ${selYear}</div>
    ${yearCierres.length===0?'<div class="empty-state"><div class="empty-icon">🏢</div><div>Sin datos</div></div>':
    (()=>{
      const byEmp={};
      yearCierres.forEach(c=>{
        if(!byEmp[c.empresaId])byEmp[c.empresaId]={emp:getEmp(c.empresaId),hojas:0,importe:0,imp10:0,imp05:0,count:0};
        byEmp[c.empresaId].hojas+=c.totalHojas||0;
        byEmp[c.empresaId].importe+=c.totalImporte||0;
        byEmp[c.empresaId].imp10+=c.impuesto10||0;
        byEmp[c.empresaId].imp05+=c.impuesto05||0;
        byEmp[c.empresaId].count++;
      });
      return`<div class="tbl-wrap"><table>
        <thead><tr><th>Empresa</th><th class="td-num">Cierres</th><th class="td-num">Hojas</th><th class="td-num">Importe</th><th class="td-num">Imp.10%</th><th class="td-num">Imp.5%</th></tr></thead>
        <tbody>${Object.values(byEmp).sort((a,b)=>b.importe-a.importe).map(x=>`<tr>
          <td style="font-weight:600">${x.emp?x.emp.nombre:x.empresaId}</td>
          <td class="td-num td-mono">${x.count}</td>
          <td class="td-num td-mono">${fmtI(x.hojas)}</td>
          <td class="td-num td-mono" style="color:var(--accent)">${fmt(x.importe)}</td>
          <td class="td-num td-mono" style="color:var(--yellow)">${fmt(x.imp10)}</td>
          <td class="td-num td-mono" style="color:var(--red)">${fmt(x.imp05)}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    })()}
  </div>`;
}

// ═══ INIT ═══
updateHeader();
renderDashboard();
syncCompanies();
</script>
</body>
</html>
